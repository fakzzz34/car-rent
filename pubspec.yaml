name: car_rent
description: "A new Flutter project."


publish_to: 'none' 













version: 1.0.0+1

environment:
  sdk: ^3.7.2







dependencies:
  flutter:
    sdk: flutter

  
  
  cupertino_icons: ^1.0.8
  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  bloc: ^9.0.0
  get_it: ^8.0.3
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  image_path_android: "assets/images/ic_launcher.png"
  image_path_ios: "assets/images/ic_launcher.png"
  android: true 
  ios: true 
  min_sdk_android: 21 
  remove_alpha_ios: true
  background_color_ios: "#11202B"
  adaptive_icon_background: "#11202B"
  adaptive_icon_foreground: "assets/images/ic_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/